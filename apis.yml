name: Finres
description: Finres (finres SAS) is a French climate-risk analytics company building a decision platform
  for agriculture. It translates climate hazards into economic consequences for farms, agricultural value
  chains and territories, combining agronomic, pedological, climate and market data with AI models that
  are peer-reviewed and validated against published research. Two productized offerings sit on top of the
  platform - a farm-level economic and climate viability diagnostic (DPEC, currently in beta, seeded from
  a grower's TelePAC parcel file and reference datasets such as Agreste, IPPAP and RICA) and bespoke
  territorial or sector studies. Finres was founded by Florent Baarsch, previously with the World Bank,
  the United Nations and climate research institutes, and its customers include the French government,
  the World Bank, the Green Climate Fund, IFAD and the FAO. The company markets high-resolution data
  delivery into customer decision systems, but as of this enrichment pass publishes no public developer
  portal, API reference, machine-readable specification or SDK - access is arranged through a sales demo.
